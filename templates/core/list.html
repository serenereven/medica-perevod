<h1>Документы</h1>

<div style="margin-bottom:12px;">
  <input id="q" placeholder="Поиск..." />
  <button id="search">Найти</button>
</div>

<div id="auth-hint" style="margin-bottom:12px; opacity:.75;"></div>
<ul id="list"></ul>

<div style="margin-top:12px;">
  <button id="prev">←</button>
  <span id="page"></span>
  <button id="next">→</button>
</div>

<script>
  let currentPage = 1;
  let pages = 1;

  async function loadMeta() {
    const resp = await fetch("/api/documents/meta/", {credentials: "same-origin"});
    const data = await resp.json();

    document.getElementById("auth-hint").textContent =
      data.authenticated ? "" : "Войдите, чтобы скачать документы.";
  }

  function buildQS() {
    const p = new URLSearchParams();
    const q = document.getElementById("q").value.trim();

    if (q) p.set("q", q);

    p.set("page", String(currentPage));
    p.set("page_size", "20");
    return p.toString();
  }

  async function loadList() {
    const resp = await fetch(`/api/documents/?${buildQS()}`, {credentials: "same-origin"});
    const data = await resp.json();

    // DRF pagination: {count, from, to, next, previous, results}
    const list = document.getElementById("list");
    list.innerHTML = "";

    const total = data.count || 0;
    pages = Math.max(1, Math.ceil(total / 20));

    for (const d of data.results || []) {
      const li = document.createElement("li");
      li.style.marginBottom = "14px";

      li.innerHTML = `
        <div><strong>${escapeHtml(d.title)}</strong></div>
        ${d.description ? `<div>${escapeHtml(d.description)}</div>` : ""}
        <div>${escapeHtml(d.file_size_display)} · ${escapeHtml(d.extension)} · скачиваний: ${d.download_count}</div>
        ${d.preview_url ? `<img src="${d.preview_url}" alt="preview" style="max-width:240px;height:auto;margin-top:6px;">` : ""}
        <div style="margin-top:6px;">
          ${d.can_download && d.download_url
            ? `<a href="${d.download_url}">Скачать</a>`
            : `<span style="opacity:.7;">Войдите, чтобы скачать</span>`}
        </div>
      `;
      list.appendChild(li);
    }

    const fromItem = data.from || 0;
    const toItem = data.to || 0;
    document.getElementById("page").textContent =
      total > 0 ? `Показано ${fromItem}–${toItem} из ${total}` : "Ничего не найдено";

    document.getElementById("prev").disabled = currentPage <= 1;
    document.getElementById("next").disabled = currentPage >= pages;
  }

  document.getElementById("search").addEventListener("click", () => {
    currentPage = 1;
    loadList();
  });

  document.getElementById("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { currentPage = 1; loadList(); }
  });

  document.getElementById("prev").addEventListener("click", () => {
    currentPage = Math.max(1, currentPage - 1);
    loadList();
  });

  document.getElementById("next").addEventListener("click", () => {
    currentPage = Math.min(pages, currentPage + 1);
    loadList();
  });

  function escapeHtml(s) {
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  (async function init() {
    await loadMeta();
    await loadList();
  })();
</script>
